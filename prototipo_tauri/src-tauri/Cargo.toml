[package]
name = "prancha-assistiva"
version = "2.2.4"
description = "Prancha de comunicação assistiva por rastreamento ocular"
authors = ["Eye-Tracking Assistivo"]
edition = "2021"

[lib]
name = "prancha_assistiva_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
