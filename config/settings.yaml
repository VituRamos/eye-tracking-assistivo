# =====================================================================
# Configuração central do Eye-Tracking Assistivo V2.1
# Ajuste estes valores sem precisar tocar em código Python.
# =====================================================================

# Versão do formato deste arquivo (usada pelo próprio app nas migrações).
versao_config: 2

deteccao:
  dwell_ms: 700            # tempo de olhar fixo para confirmar a opção
  tolerancia_perda_ms: 180 # perda curta de foco tolerada sem zerar o dwell
  exibicao_confirmacao_ms: 1500 # quanto tempo "SELECIONADO" fica na tela
  alpha_ema: 0.35          # 0=muito suave/lento, 1=sem suavização
  tamanho_historico_grafico: 200
  # Tempo contínuo (ms) sem rosto antes de avisar "reposicione o rosto".
  # Usa tempo real, então funciona igual em câmeras de 15, 30 ou 60 fps.
  sem_rosto_ms: 2000
  # Diferença máxima aceitável entre os ratios dos dois olhos. Acima
  # disso o quadro é tratado como inválido (piscada, oclusão, ruído) e
  # não conta para seleção nem para calibração. Aumente para quem tem
  # estrabismo ou olhos que divergem de forma consistente.
  divergencia_max: 0.25

  # Compensação opcional da pose da cabeça no ratio horizontal. Fica
  # DESLIGADA por padrão: o ratio já é normalizado dentro do olho e a
  # compensação pode ampliar a deriva entre calibrar e usar. Se ligar,
  # recalibre a prancha com a opção já ativa.
  compensar_yaw: false
  yaw_sensibilidade: 0.004   # deslocamento do ratio por grau de yaw

  # Confiança mínima do detector de rosto (0..1). Aumente em ambientes
  # com ruído; diminua se o rosto demorar a ser encontrado.
  confianca_minima: 0.5

  # Indicador informativo de distância do rosto até a câmera. Não
  # bloqueia seleção nem calibração: serve para avisar quando o rosto
  # está muito longe ou muito perto. A medida é a distância entre os
  # cantos externos dos olhos, em fração da largura da imagem.
  # Câmeras com campo de visão muito diferente podem precisar de ajuste.
  distancia_habilitada: true
  distancia_longe_abaixo: 0.11 # abaixo disso: rosto longe
  distancia_perto_acima: 0.34  # acima disso: rosto perto demais
  distancia_entrada_ms: 800    # tempo contínuo fora da faixa para avisar
  distancia_saida_ms: 600      # tempo contínuo na faixa para o aviso sumir

  # Confirmação por piscada (alternativa ao dwell time)
  piscada:
    habilitada: true
    limiar_ear: 0.15       # abaixo disso, considera olho fechado
    piscada_ms: 120        # tempo mínimo de olho fechado para confirmar
    foco_minimo_ms: 150    # tempo mínimo de foco antes de aceitar a piscada

calibracao:
  duracao_ms: 3000         # duração de cada fase (ESQUERDA e DIREITA)
  min_amostras: 30         # amostras válidas mínimas por fase
  max_yaw_graus: 25.0      # acima disso, a cabeça está virada demais: ignora
  max_pitch_graus: 25.0    # cabeça muito para cima/baixo também distorce o ratio_y
  max_roll_graus: 30.0     # inclinação lateral (orelha no ombro)
  diferenca_minima: 0.03   # abaixo disso, a calibração é considerada fraca

prancha:
  # Distância mínima (em ratio de íris) entre dois cartões calibrados.
  # Abaixo disso, dois blocos ficam "no mesmo lugar" e a seleção fica
  # ambígua -- a calibração é marcada como fraca.
  distancia_minima_boa: 0.02
  # Distância máxima do olhar até o cartão calibrado mais próximo.
  # Mantido por compatibilidade; a classificação atual usa o quadrante da
  # grade calibrada (com zona morta central), não este raio.
  raio_max: 0.55

camera:
  indice: 0
  largura: 1280
  altura: 720
  fps: 30
  # auto = tenta MSMF, depois DirectShow e por fim o backend padrao.
  # Use "dshow" ou "msmf" para forcar um backend especifico.
  backend: "auto"
  # Tempo maximo (ms) esperando o primeiro frame ao abrir a camera.
  timeout_inicial_ms: 6000

modelo:
  caminho: "models/face_landmarker.task"
  url: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
  # O modelo vai versionado no repositorio (models/face_landmarker.task).
  # O checksum garante que o arquivo local e o oficial sao o mesmo modelo
  # de 478 pontos (com iris). Se faltar ou divergir, ele baixa de novo.
  sha256_esperado: "64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff"

perfis:
  pasta: "perfis"
  validade_dias: 7 # depois disso, sugere recalibrar em vez de reusar automaticamente

logs:
  pasta: "logs"
  nivel: "INFO"

feedback:
  som: true # bipe curto ao confirmar a seleção

aparencia:
  # Tema visual do aplicativo: "claro" ou "escuro".
  tema: "claro"

janela:
  titulo: "Eye-Tracking Assistivo V2.1 (MediaPipe)"
  fullscreen: true
  # Resolução desejada para a janela do aplicativo (16:9):
  # 1280x720 ou 1920x1080. Se não couber na tela, o app reduz
  # proporcionalmente e centraliza.
  resolucao: "1920x1080"
