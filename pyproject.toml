[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["Protótipo", ".venv", "build", "dist", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "RUF", "SIM"]
ignore = [
  "RUF001", # caracteres unicode ambíguos (textos em português)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]
